<div class="page">
  <header class="page-header">
    <h1 class="page-title">
      Runs
      <span class="page-meta">({{ runCount() }})</span>
    </h1>
    <div class="page-actions">
      <a mat-flat-button color="primary" routerLink="/runs/new">
        <mat-icon>add</mat-icon>
        New Run
      </a>
    </div>
  </header>

  <mat-card>
    <mat-card-content>
      @if (loading()) {
        <div class="loading-container">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else if (runs().length === 0) {
        <p class="empty-message">No runs yet. Create one to get started.</p>
      } @else {
        <table mat-table [dataSource]="runs()" class="full-width">
          <ng-container matColumnDef="sampleId">
            <th mat-header-cell *matHeaderCellDef>Sample ID</th>
            <td mat-cell *matCellDef="let run">{{ run.sampleId }}</td>
          </ng-container>

          <ng-container matColumnDef="currentState">
            <th mat-header-cell *matHeaderCellDef>State</th>
            <td mat-cell *matCellDef="let run">
              @let badge = run.currentState | stateBadge;
              <mat-chip-set>
                <mat-chip [class]="badge.cssClass" [highlighted]="!!badge.color">
                  {{ badge.label }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let run">{{ run.createdAt | date: 'short' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let run">
              <a mat-icon-button [routerLink]="['/runs', run.id]" aria-label="View run details">
                <mat-icon>chevron_right</mat-icon>
              </a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</div>
